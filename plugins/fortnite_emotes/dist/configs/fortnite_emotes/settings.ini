// Fortnite Emotes & Dances - global settings for the C++ Metamod port.
//
// Source: SwiftlyS2 port v1.1.8, FortniteEmotesS2/Config.cs (PluginConfig) - keys and defaults
// verbatim (the C# config in turn keeps all keys of the official v1.1.8 release config).
// The emote/dance list lives in emotes.ini ("Emotes" section).
//
// Format: Valve KeyValues. Booleans are 0/1. List-typed values are ";"-separated
// (the C# config uses JSON arrays; a single empty string means "everyone" for permissions).
// An absent key keeps the built-in default; a present but empty one means "empty list".
//
// Access lists (EmoteDanceCommandPerm, AdminSetEmoteDanceCommandPerm, VIPPerm below, and the
// per-emote "permission" field in emotes.ini) are ";"-separated. A player passes when ANY entry
// matches; an entry is one of:
//   ""              - everyone (the default)
//   "vip"           - any VIP, needs the VIP core (vip.so)
//   "vip:<feature>" - the player's bool value of the VIP group feature <feature> from
//                     addons/configs/vip/groups.ini, needs the VIP core
//   anything else   - an admin permission checked with IAdminApi::HasPermission
//                     (admin_system.so), e.g. "emotes.admin"
//
"Settings"
{
	// 0 = always, 1 = warmup + freezetime only, 2 = warmup + freezetime + round end
	"EmoteAllowedPeriod"			"0"

	// Stop every running emote when the freezetime ends
	"StopEmoteAfterFreezetimeEnd"	"0"

	// The dancing player takes no damage (TakeDamage hook zeroes the damage)
	"StopDamageWhenInEmote"			"0"

	// Config-compat only: the original had 0 = chat menu, 1 = center HTML menu, 2 = KitsuneMenu.
	// The C++ port has one menu implementation; value is read but unused (warn when != 2)
	"EmoteMenuType"					"2"

	// Hide other players from the dancing player: 0 = off, 1 = enemies, 2 = teammates, 3 = all
	"EmoteHidePlayers"				"0"

	// Config-compat only (KitsuneMenu developer display). Unused in code
	"KitsuneMenuDeveloperDisplay"	"1"

	// Freeze the player (MOVETYPE_OBSOLETE) while the emote plays
	"EmoteFreezePlayer"				"1"

	// Keep the real pawn invisible every tick (not only once after the emote starts)
	"ForcePlayerVisibility"			"0"

	// Hide/restore the real pawn's econ gloves during the emote (see SPEC.md E/Gloves)
	"EmoteGlovesFix"				"1"

	// Third person camera follows the player every tick
	"CameraMoveable"				"1"

	// Camera traces against walls and pulls in instead of clipping
	"CameraBlockObject"				"1"

	// Cooldown in seconds for regular players (<= 0 becomes 0.1 s)
	"EmoteCooldown"					"20"

	// Cooldown in seconds for players with VIPPerm (<= 0 becomes 0.1 s)
	"EmoteVIPCooldown"				"15"

	// Buttons that cancel a running emote; valid names:
	// w,s,a,d,use,speed,walk,jump,leftclick,rightclick,crouch,scoreboard,inspect
	// (speed and walk both mean Shift; unknown names are ignored)
	"EmoteCancelButtons"			"w,a,s,d,jump,crouch,leftclick"

	// Sound event files precached at map load (from workshop addon 3328582199)
	"EmoteSoundEventFiles"			"soundevents/fortnite_emotes.vsndevts"

	// Chat/console command names and aliases (see SPEC.md B)
	"EmoteCommand"					"emote;emotes"
	"DanceCommand"					"dance;dances"
	"AdminSetEmoteCommand"			"setemote;setemotes"
	"AdminSetDanceCommand"			"setdance;setdances"

	// Permission for !emote / !dance and the chat triggers ("" = everyone).
	// "vip:emotes" = VIP groups that have "emotes" "1" in addons/configs/vip/groups.ini
	// (PREMIUM, PROVIP, LEGEND on our servers). Needs the VIP core; without it nobody passes.
	"EmoteDanceCommandPerm"			"vip:emotes"

	// Permission for !setemote / !setdance (was "@css/root" in the original config)
	"AdminSetEmoteDanceCommandPerm"	"emotes.admin"

	// Permission that selects the VIP cooldown (was "@css/vip" in the original config)
	"VIPPerm"						"vip"

	// Play the sound events of the addon
	"SoundModuleEnabled"			"1"

	// Enable chat triggers (typing e.g. "floss" in chat)
	"ChatTriggersEnabled"			"1"

	// Version of the default configuration this build expects (PluginConfig.CurrentVersion)
	"ConfigVersion"					"5"

	// Verbose debug logging
	"DebugLogs"						"0"

	// --- C++ port additions ------------------------------------------------------------------

	// Who hears the emote sound: 0 = only the dancing player (C# port behavior), 1 = everybody
	"SoundRecipients"				"0"

	// VIP feature (VIP_INT in addons/configs/vip/groups.ini) that overrides EmoteVIPCooldown
	// per player when it is > 0; empty = ignore the feature
	"VIPCooldownFeature"			"emotes_cooldown"

	// Safety net: stop an emote that waits for OnAnimationDone after this many seconds
	// (0 or less disables the safety net)
	"MaxEmoteSeconds"				"60"

	// Gamedata (linux byte patterns, "?" = wildcard). An empty value disables the feature.
	// CEntityIOOutput::FireOutputInternal - prop_dynamic "OnAnimationDone" output hook
	"SigFireOutputInternal"			"55 48 89 E5 41 57 49 89 FF 41 56 41 55 41 54 49 89 D4 53 48 89 F3 48 81 EC ? ? ? ? 48 8D 05"
	// UTIL_TraceShape + GetGameTraceManager - camera wall trace (addons/configs/signatures.ini)
	"SigTraceShape"					"55 48 8D 05 ? ? ? ? 48 89 E5 41 57 49 89 F7 41 56 48 8D 35 ? ? ? ? 49 89 CE"
	"SigGetGameTraceManager"		"48 8D 05 ? ? ? ? 0F 2E D1"
}
