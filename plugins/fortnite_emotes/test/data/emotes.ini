// 37 emotes + 43 dances, same order, same values). If the live emotes.jsonc is available,
// it is authoritative - regenerate this file from it instead
// (tools/gen_from_cs.py contains the conversion; the live file was unreadable in this session).
//
// Field mapping to the C# Emote class:
//   type             IsEmote                   "emote" | "dance"
//   model            Model                     model that carries the animation
//   anim_intro       AnimationName             main sequence played on start
//   anim_loop        DefaultAnimationName      sequence switched to later (may be empty)
//   anim_loop_after  SetToDefaultAnimationDuration  seconds until anim_loop, -1 = never
//   duration         AnimationDuration         seconds until the emote stops, -1 = never
//   sound            Sound                     sound event emitted on start (may be empty)
//   sound_volume     SoundVolume               volume of the sound event
//   sound_loop_after LoopSoundAfterSeconds     repeat the sound every N seconds, -1 = off
//   triggers         Trigger                   exact chat triggers, ";"-separated (case-sensitive)
//   permission       Permission                ";"-separated permission strings, "" = everyone
//
